
name: Node.js CI-CD Pipeline

on:
  push:

  pull_request:

permissions:
  contents: read

jobs:

  # JOB 1: TEST APPLICATION
  test:
    name: Test Node.js Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check application syntax
        run: node --check app.js

      - name: Run application tests
        run: npm test


 
  # JOB 2: BUILD AND PUSH DOCKER IMAGE
  build-image:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/node-app-deployment:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/node-app-deployment:${{ github.sha }}

      - name: Verify Docker Image in Docker Hub
        run: |
          docker buildx imagetools inspect ${{ secrets.DOCKERHUB_USERNAME }}/node-app-deployment:latest
          docker buildx imagetools inspect ${{ secrets.DOCKERHUB_USERNAME }}/node-app-deployment:${{ github.sha }}
