
name: Node.js Continuous Integration

# Trigger the workflow whenever code is pushed
# or a Pull Request is created or updated.

on:
  push:

  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test Node.js Application

    # GitHub provides an Ubuntu Linux machine
    runs-on: ubuntu-latest

    steps:

      # Step 1: Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v7

      # Step 2: Setup Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Validate JavaScript syntax
      - name: Check application syntax
        run: node --check app.js

      # Step 5: Execute unit tests
      - name: Run application tests
        run: npm test
